sources:
  - name: history-tutor-orders
    kind: public_html
    url: "https://profi.ru/rabota/repetitor/istoriya/"
    enabled: true
  - name: history-ege-tutor-orders
    kind: public_html
    url: "https://profi.ru/rabota/repetitor/repetitor-po-podgotovke-k-ege-po-istorii/"
    enabled: true
  - name: social-studies-tutor-orders
    kind: public_html
    url: "https://profi.ru/rabota/repetitor/obshchestvoznanie/"
    enabled: true
  - name: general-tutor-orders
    kind: public_html
    url: "https://profi.ru/rabota/repetitor/"
    enabled: true

filters:
  include_keywords:
    - история
    - егэ
    - огэ
    - впр
    - обществознание
    - мцко по истории
    - олимпиады по истории
    - всемирная история
    - история россии
    - история искусств
  exclude_keywords:
    - бесплатно
    - студент
    - только с отзывами
    - контрольная
    - зачет
  cities: []
  min_price: null
  max_price: null

fetch:
  timeout_seconds: 20
  delay_between_requests_seconds: 5
  user_agent: "Mozilla/5.0 profiru-orders-watcher/0.1"
  discover_related_sources: true
  max_discovered_sources: 25
  related_source_prefixes:
    - "/rabota/repetitor/"
  selenium_headless: true
  selenium_page_wait_seconds: 10
  selenium_profile_path: null

storage:
  sqlite_path: "/data/orders.sqlite3"
