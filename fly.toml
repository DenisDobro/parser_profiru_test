# fly.toml app configuration file generated for profiru-orders-watcher-denisdobro on 2026-05-11T10:13:22Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'profiru-orders-watcher-denisdobro'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[processes]
  app = 'profiru-watch loop --config /app/config.production.yaml --interval 300'

[[mounts]]
  source = 'orders_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
